<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Oto Yıkama Takip</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#eef2f7}
    *{box-sizing:border-box} body{margin:0;padding:16px;max-width:900px;margin:auto}
    h1{margin:8px 0 16px;font-size:25px}.card{background:#fff;border-radius:16px;padding:15px;margin:12px 0;box-shadow:0 4px 18px #1f293712}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{text-align:center;background:#f3f6fa;border-radius:12px;padding:11px 5px;font-size:12px}.stat b{display:block;font-size:20px;color:#0f766e;margin-bottom:3px}
    input,select,button{width:100%;font:inherit;border:1px solid #ccd4df;border-radius:11px;padding:12px;margin:5px 0;background:#fff}
    button{border:0;background:#0f766e;color:#fff;font-weight:700}.secondary{background:#e8eef4;color:#253046}.danger{background:#b42318}.paid{background:#2563eb}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row{border-top:1px solid #e5e9ef;padding:13px 0}.row:first-child{border:0}.titleline{display:flex;justify-content:space-between;gap:8px;align-items:center}.badge{font-size:12px;background:#e6f4f1;color:#0f766e;padding:5px 8px;border-radius:99px;white-space:nowrap}.muted{color:#667085;font-size:13px}.actions{display:grid;grid-template-columns:1fr auto;gap:8px}.actions .danger{width:auto}.empty{text-align:center;color:#667085;padding:18px}.section-title{cursor:pointer;user-select:none;margin:0}.notice{font-size:12px;color:#667085;margin:8px 0 0}.credit-head{display:flex;justify-content:space-between;gap:8px}.credit-total{font-weight:800;color:#b42318}
    @media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}body{padding:12px}}
  </style>
</head>
<body>
  <h1>🚗 Oto Yıkama Takip</h1>

  <div class="card stats">
    <div class="stat"><b id="count">0</b>Araç</div>
    <div class="stat"><b id="ciro">₺0</b>Ciro</div>
    <div class="stat"><b id="gider">₺0</b>Gider</div>
    <div class="stat"><b id="net">₺0</b>Net Kalan</div>
    <div class="stat"><b id="kasa">₺0</b>Kasa</div>
    <div class="stat"><b id="veresiye">₺0</b>Veresiye</div>
  </div>

  <div class="card">
    <h3 class="section-title" onclick="toggle('veresiyeListesi')">💳 Veresiye Defteri ▼</h3>
    <div id="veresiyeListesi" style="display:none"></div>
  </div>

  <div class="card">
    <h3 class="section-title" onclick="toggle('gecmisListesi')">📚 Geçmiş Kayıtlar ▼</h3>
    <div id="gecmisListesi" style="display:none"></div>
  </div>

  <div class="card">
    <h3 class="section-title" onclick="toggle('giderBolumu')">🧾 Günlük Giderler ▼</h3>
    <div id="giderBolumu" style="display:none">
      <input id="expenseDesc" placeholder="Gider açıklaması (kimyasal, yemek vb.)">
      <input id="expenseAmount" type="number" min="0" inputmode="decimal" placeholder="Gider tutarı">
      <button type="button" onclick="addExpense()">+ Gider Ekle</button>
      <div id="expenseList"></div>
    </div>
  </div>

  <div class="card">
    <h3>Yeni Araç</h3>
    <input id="plate" placeholder="Plaka" autocapitalize="characters" list="plateSuggestions">
    <datalist id="plateSuggestions"></datalist>
    <label class="muted" for="plateCamera">Plakanın fotoğrafını çek</label>
    <input id="plateCamera" type="file" accept="image/*" capture="environment">
    <input id="customer" placeholder="Müşteri adı (isteğe bağlı)" list="customerSuggestions">
    <datalist id="customerSuggestions"></datalist>
    <div class="grid">
      <select id="service">
        <option>İç + Dış Yıkama</option><option>İç Yıkama</option><option>Dış Yıkama</option><option>Detaylı Temizlik</option><option>Pasta Cila</option><option>Diğer</option>
      </select>
      <input id="price" type="number" min="0" inputmode="decimal" placeholder="Ücret">
    </div>
    <div class="grid">
      <select id="payment"><option>Nakit</option><option>Kart</option><option>Veresiye</option></select>
      <select id="status"><option>Bekliyor</option><option>Yıkanıyor</option><option>Hazır</option><option>Teslim Edildi</option></select>
    </div>
    <button type="button" onclick="addCar()">+ Araç Ekle</button>
    <p class="notice">Kamera fotoğrafı açılır; plaka şimdilik kutuya elle yazılır.</p>
  </div>

  <div class="card"><h3>Araçlar</h3><div id="list"></div></div>

<script>
const CAR_KEY="otoCars";
const HISTORY_KEY="gecmisKayitlar";
const CLOSE_KEY="sonArsivTarihi";
const WASH_KEY="plakaYikamaSayilari";
const EXPENSE_KEY="gunlukGiderler";
const CUSTOMER_KEY="musteriHafizasi";

let cars=safeArray(CAR_KEY);
let history=safeArray(HISTORY_KEY);
let washCounts=safeObject(WASH_KEY);
let expenses=safeArray(EXPENSE_KEY);
let customers=safeArray(CUSTOMER_KEY);

function safeArray(key){try{const v=JSON.parse(localStorage.getItem(key));return Array.isArray(v)?v:[]}catch{return []}}
function safeObject(key){try{const v=JSON.parse(localStorage.getItem(key));return v&&typeof v==="object"&&!Array.isArray(v)?v:{}}catch{return {}}}
function save(){localStorage.setItem(CAR_KEY,JSON.stringify(cars));localStorage.setItem(HISTORY_KEY,JSON.stringify(history));localStorage.setItem(WASH_KEY,JSON.stringify(washCounts));localStorage.setItem(EXPENSE_KEY,JSON.stringify(expenses));localStorage.setItem(CUSTOMER_KEY,JSON.stringify(customers))}
function money(n){return "₺"+Number(n||0).toLocaleString("tr-TR")}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function dayText(d=new Date()){return d.toLocaleDateString("tr-TR")}
function dateTimeText(value){const d=value?new Date(value):new Date();return Number.isNaN(d.getTime())?"Tarih yok":d.toLocaleString("tr-TR",{dateStyle:"short",timeStyle:"short"})}
function normalizePlate(v){return v.toLocaleUpperCase("tr-TR").replace(/[^0-9A-ZÇĞİÖŞÜ]/g,"").trim()}
function normalizeName(v){return String(v||"").toLocaleLowerCase("tr-TR").trim()}
function toggle(id){const el=document.getElementById(id);el.style.display=el.style.display==="none"?"block":"none"}

function rememberCustomer(record){
  const plate=normalizePlate(record.plate||"");
  if(!plate)return;
  const found=customers.find(c=>normalizePlate(c.plate)===plate);
  const data={plate,customer:String(record.customer||"").trim(),service:record.service||"İç + Dış Yıkama",price:Number(record.price||0),updatedAt:record.createdAt||new Date().toISOString()};
  if(found)Object.assign(found,data);else customers.unshift(data);
}
function buildCustomerMemory(){
  if(customers.length)return;
  history.slice().reverse().forEach(h=>(h.cars||[]).forEach(rememberCustomer));
  cars.slice().reverse().forEach(rememberCustomer);
  save();
}
function fillKnownCustomer(record,source){
  if(!record)return;
  if(source!=="plate")document.getElementById("plate").value=record.plate||"";
  if(source!=="customer")document.getElementById("customer").value=record.customer||"";
  if(record.service)document.getElementById("service").value=record.service;
  if(Number(record.price)>=0)document.getElementById("price").value=record.price;
}
function findByPlate(){const value=normalizePlate(document.getElementById("plate").value);const record=customers.find(c=>normalizePlate(c.plate)===value);fillKnownCustomer(record,"plate")}
function findByCustomer(){const value=normalizeName(document.getElementById("customer").value);if(!value)return;const record=customers.find(c=>normalizeName(c.customer)===value);fillKnownCustomer(record,"customer")}
function renderSuggestions(){
  document.getElementById("plateSuggestions").innerHTML=customers.map(c=>`<option value="${esc(c.plate)}">${esc(c.customer||"")}</option>`).join("");
  document.getElementById("customerSuggestions").innerHTML=customers.filter(c=>c.customer).map(c=>`<option value="${esc(c.customer)}">${esc(c.plate)}</option>`).join("");
}

function addCar(){
  const plate=normalizePlate(document.getElementById("plate").value);
  const customer=document.getElementById("customer").value.trim();
  const price=Number(document.getElementById("price").value);
  const service=document.getElementById("service").value;
  const payment=document.getElementById("payment").value;
  const status=document.getElementById("status").value;
  if(!plate){alert("Plaka yazmalısın.");return}
  if(!Number.isFinite(price)||price<0){alert("Geçerli bir ücret yazmalısın.");return}
  washCounts[plate]=(Number(washCounts[plate])||0)+1;
  const record={id:Date.now(),plate,customer,price,service,payment,status,washNo:washCounts[plate],createdAt:new Date().toISOString()};
  cars.unshift(record);
  rememberCustomer(record);
  ["plate","customer","price","plateCamera"].forEach(id=>document.getElementById(id).value="");
  save();render();
}

function changeStatus(id,value){const car=cars.find(c=>c.id===id);if(car){car.status=value;save();render()}}
function delCar(id){if(!confirm("Bu araç kaydı silinsin mi?"))return;cars=cars.filter(c=>c.id!==id);save();render()}
function collectCredit(plate){
  const open=cars.filter(c=>c.plate===plate&&c.payment==="Veresiye");
  if(!open.length)return;
  if(!confirm(plate+" için "+money(open.reduce((a,c)=>a+Number(c.price||0),0))+" tahsil edildi mi?"))return;
  open.forEach(c=>{c.payment="Nakit";c.collectedAt=new Date().toISOString()});save();render();
}

function addExpense(){
  const description=document.getElementById("expenseDesc").value.trim();
  const amount=Number(document.getElementById("expenseAmount").value);
  if(!description){alert("Gider açıklaması yazmalısın.");return}
  if(!Number.isFinite(amount)||amount<=0){alert("Geçerli bir gider tutarı yazmalısın.");return}
  expenses.unshift({id:Date.now(),description,amount,createdAt:new Date().toISOString()});
  document.getElementById("expenseDesc").value="";
  document.getElementById("expenseAmount").value="";
  save();render();
}
function delExpense(id){if(!confirm("Bu gider kaydı silinsin mi?"))return;expenses=expenses.filter(e=>e.id!==id);save();render()}

function closeDayIfNeeded(){
  const now=new Date();
  if(now.getHours()<20)return;
  const today=dayText(now);
  if(localStorage.getItem(CLOSE_KEY)===today)return;
  const daily=cars.filter(c=>c.payment!=="Veresiye");
  if(daily.length||expenses.length)history.unshift({date:today,cars:daily,expenses:[...expenses]});
  cars=cars.filter(c=>c.payment==="Veresiye");
  expenses=[];
  localStorage.setItem(CLOSE_KEY,today);save();
}

function carRow(c){
  const options=["Bekliyor","Yıkanıyor","Hazır","Teslim Edildi"].map(s=>`<option ${c.status===s?"selected":""}>${s}</option>`).join("");
  return `<div class="row"><div class="titleline"><b>${esc(c.plate)}</b><span class="badge">${esc(c.washNo||washCounts[c.plate]||1)}. yıkama</span></div><div>${esc(c.customer||"Müşteri adı yok")} · ${esc(c.service||"")}</div><div><b>${money(c.price)}</b> · ${esc(c.payment||"Nakit")}</div><div class="muted">📅 ${dateTimeText(c.createdAt)}</div><div class="actions"><select onchange="changeStatus(${Number(c.id)},this.value)">${options}</select><button class="danger" onclick="delCar(${Number(c.id)})">Sil</button></div></div>`;
}

function renderCredit(){
  const groups={};
  cars.filter(c=>c.payment==="Veresiye").forEach(c=>{if(!groups[c.plate])groups[c.plate]={customer:c.customer,items:[],total:0};groups[c.plate].items.push(c);groups[c.plate].total+=Number(c.price||0)});
  const values=Object.entries(groups);
  document.getElementById("veresiyeListesi").innerHTML=values.length?values.map(([plate,g])=>`<div class="row"><div class="credit-head"><div><b>${esc(plate)}</b><div class="muted">${esc(g.customer||"Müşteri adı yok")} · ${g.items.length} yıkama</div></div><span class="credit-total">${money(g.total)}</span></div>${g.items.map((c,i)=>`<div class="muted">${i+1}. yıkama — ${esc(c.service||"")} — ${money(c.price)} — 📅 ${dateTimeText(c.createdAt)}</div>`).join("")}<button class="paid" onclick="collectCredit('${esc(plate)}')">Ödeme Alındı</button></div>`).join(""):`<div class="empty">Açık veresiye kaydı yok.</div>`;
}

function renderHistory(){
  document.getElementById("gecmisListesi").innerHTML=history.length?history.map(h=>{const gross=(h.cars||[]).reduce((a,c)=>a+Number(c.price||0),0);const spent=(h.expenses||[]).reduce((a,e)=>a+Number(e.amount||0),0);return `<div class="row"><b>${esc(h.date)}</b><div class="muted">${(h.cars||[]).length} araç · Ciro ${money(gross)} · Gider ${money(spent)} · Net ${money(gross-spent)}</div></div>`}).join(""):`<div class="empty">Henüz geçmiş kayıt yok.</div>`;
}

function renderExpenses(){
  document.getElementById("expenseList").innerHTML=expenses.length?expenses.map(e=>`<div class="row"><div class="titleline"><div><b>${esc(e.description)}</b><div class="muted">📅 ${dateTimeText(e.createdAt)}</div></div><b>${money(e.amount)}</b></div><button class="danger" onclick="delExpense(${Number(e.id)})">Gideri Sil</button></div>`).join(""):`<div class="empty">Bugün gider eklenmedi.</div>`;
}

function render(){
  closeDayIfNeeded();
  const paid=cars.filter(c=>c.payment!=="Veresiye").reduce((a,c)=>a+Number(c.price||0),0);
  const credit=cars.filter(c=>c.payment==="Veresiye").reduce((a,c)=>a+Number(c.price||0),0);
  const spent=expenses.reduce((a,e)=>a+Number(e.amount||0),0);
  const oldIncome=history.reduce((total,h)=>total+(h.cars||[]).filter(c=>c.payment!=="Veresiye").reduce((sum,c)=>sum+Number(c.price||0),0),0);
  const oldExpenses=history.reduce((total,h)=>total+(h.expenses||[]).reduce((sum,e)=>sum+Number(e.amount||0),0),0);
  const cashBalance=oldIncome+paid-oldExpenses-spent;
  document.getElementById("count").textContent=cars.length;
  document.getElementById("ciro").textContent=money(paid);
  document.getElementById("gider").textContent=money(spent);
  document.getElementById("net").textContent=money(paid-spent);
  document.getElementById("kasa").textContent=money(cashBalance);
  document.getElementById("veresiye").textContent=money(credit);
  document.getElementById("list").innerHTML=cars.length?cars.map(carRow).join(""):`<div class="empty">Bugün henüz araç eklenmedi.</div>`;
  renderCredit();renderHistory();renderExpenses();
  renderSuggestions();
}

document.getElementById("plate").addEventListener("input",findByPlate);
document.getElementById("customer").addEventListener("input",findByCustomer);
buildCustomerMemory();closeDayIfNeeded();render();setInterval(()=>{closeDayIfNeeded();render()},60000);
</script>
</body>
</html>
