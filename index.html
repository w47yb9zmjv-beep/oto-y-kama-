<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oto Yıkama Takip</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;margin:0;padding:16px;color:#17202a}
h1{font-size:24px;margin:4px 0 14px}
.card{background:white;border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 2px 10px #00000012}
input,select,button{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d9dee3;border-radius:10px;font-size:16px;margin:5px 0}
button{background:#111827;color:white;border:0;font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#eef2ff;padding:12px;border-radius:12px;text-align:center}.stat b{display:block;font-size:21px}
.row{border:1px solid #e3e7eb;border-radius:12px;padding:12px;margin-top:10px}
.badge{display:inline-block;padding:5px 8px;border-radius:8px;background:#eef2f7;font-size:13px}
.delete{background:#ef4444;margin-top:8px}.muted{color:#667085;font-size:13px}
</style>
</head>
<body>
<h1>🚗 Oto Yıkama Takip</h1>

<div class="card stats">
  <div class="stat"><b id="count">0</b>Araç</div>
  <div class="stat"><b id="cari">₺0</b>Cari</div>
<div class="stat"><b id="kasa">₺0</b>Kasa</div>
  
</div>

<div class="card">
<h3>Yeni Araç</h3>
<input id="plate" placeholder="Plaka">
<input id="customer" placeholder="Müşteri adı">
<select id="service">
<option>İç + Dış Yıkama</option><option>İç Yıkama</option><option>Dış Yıkama</option><option>Detaylı Temizlik</option>
</select>
<input id="price" type="number" placeholder="Ücret (₺)">
<select id="payment">
  <option>Nakit</option>
  <option>Cari</option>
  <option>Veresiye</option>
</select>
 
  
  <option>Nakit</option>
  <option>Cari</option>
  <option>Veresiye</option>

<select id="status"><option>Bekliyor</option><option>Yıkanıyor</option><option>Hazır</option><option>Teslim edildi</option></select>
<button onclick="addCar()">+ Araç Ekle</button>
</div>

<div class="card">
<h3>Araçlar</h3>
<div id="list"></div>
</div>

<script>
let cars=JSON.parse(localStorage.getItem("otoCars")||"[]");
function save(){localStorage.setItem("otoCars",JSON.stringify(cars));render();}
function addCar(){
 const plate=document.getElementById("plate").value.trim().toUpperCase();
 const customer=document.getElementById("customer").value.trim();
 const price=Number(document.getElementById("price").value||0);
const service=document.getElementById("service").value;
const payment=document.getElementById("payment").value;
 if(!plate){alert("Plaka yazmalısın.");return}
cars.unshift({id:Date.now(),plate,customer,service,price,payment,status:document.getElementById("status").value,time:new Date().toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})});
 ["plate","customer","price"].forEach(x=>document.getElementById(x).value="");
 save();
}
function changeStatus(id,value){cars=cars.map(c=>c.id===id?{...c,status:value}:c);save();}
function del(id){cars=cars.filter(c=>c.id!==id);save();}
function render(){
  const kasa=cars
  .filter(c=>c.payment==="Nakit" && c.status==="Teslim edildi")
  .reduce((a,c)=>a+c.price,0);

const veresiye=cars
  .filter(c=>c.payment==="Veresiye" && c.status==="Teslim edildi")
  .reduce((a,c)=>a+c.price,0);

const total=cars
  .filter(c=>c.payment==="Cari")
  .reduce((a,c)=>a+c.price,0);

document.getElementById("kasa").textContent="₺"+kasa.toLocaleString("tr-TR");
document.getElementById("veresiye").textContent="₺"+veresiye.toLocaleString("tr-TR");
document.getElementById("count").textContent=cars.length;
document.getElementById("cari").textContent="₺"+total.toLocaleString("tr-TR");
const list=document.getElementById("list");
 list.innerHTML=cars.map(c=>`
 <div class="row">
  <b>${c.plate}</b> <span class="badge">${c.status}</span>
  <div>${c.customer||"Müşteri adı yok"} · ${c.service}</div>
  <div><b>₺${c.price.toLocaleString("tr-TR")}</b> · ${c.payment} · ${c.time}</div>
  <select onchange="changeStatus(${c.id},this.value)">
   ${["Bekliyor","Yıkanıyor","Hazır","Teslim edildi"].map(s=>`<option ${s===c.status?"selected":""}>${s}</option>`).join("")}
  </select>
  <button class="delete" onclick="del(${c.id})">Sil</button>
 </div>`).join("");
}
render();
</script>
</body>
</html>
