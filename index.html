<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Oto Yıkama Takip</title>

  <style>
    :root{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:#172033;
      background:#eef2f7
    }

    *{box-sizing:border-box}

    body{
      margin:0 auto;
      padding:16px;
      max-width:900px
    }

    h1{
      margin:8px 0 16px;
      font-size:25px
    }

    .card{
      background:#fff;
      border-radius:16px;
      padding:15px;
      margin:12px 0;
      box-shadow:0 4px 18px #1f293712
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:8px
    }

    .stat{
      text-align:center;
      background:#f3f6fa;
      border-radius:12px;
      padding:11px 5px;
      font-size:12px
    }

    .stat b{
      display:block;
      font-size:20px;
      color:#0f766e;
      margin-bottom:3px
    }

    input,select,button{
      width:100%;
      font:inherit;
      border:1px solid #ccd4df;
      border-radius:11px;
      padding:12px;
      margin:5px 0;
      background:#fff
    }

    button{
      border:0;
      background:#0f766e;
      color:#fff;
      font-weight:700
    }

    .danger{background:#b42318}
    .paid{background:#2563eb}

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px
    }

    .row{
      border-top:1px solid #e5e9ef;
      padding:13px 0
    }

    .row:first-child{border:0}

    .titleline{
      display:flex;
      justify-content:space-between;
      gap:8px;
      align-items:center
    }

    .badge{
      font-size:12px;
      background:#e6f4f1;
      color:#0f766e;
      padding:5px 8px;
      border-radius:99px;
      white-space:nowrap
    }

    .muted{
      color:#667085;
      font-size:13px
    }

    .actions{
      display:grid;
      grid-template-columns:1fr auto;
      gap:8px
    }

    .actions .danger{width:auto}

    .empty{
      text-align:center;
      color:#667085;
      padding:18px
    }

    .section-title{
      cursor:pointer;
      user-select:none;
      margin:0
    }

    .credit-head{
      display:flex;
      justify-content:space-between;
      gap:8px
    }

    .credit-total{
      font-weight:800;
      color:#b42318
    }

    .close-day{
      font-size:18px;
      padding:15px;
      background:#b52d20
    }

    @media(max-width:600px){
      .stats{grid-template-columns:1fr 1fr}
      .grid{grid-template-columns:1fr}
      body{padding:12px}
    }
  </style>
</head>

<body>

  <h1>🚗 Oto Yıkama Takip</h1>

  <button class="close-day" type="button" onclick="closeDay()">
    🌙 Günü Kapat
  </button>

  <div class="card stats">
    <div class="stat"><b id="count">0</b>Araç</div>
    <div class="stat"><b id="ciro">₺0</b>Ciro</div>
    <div class="stat"><b id="gider">₺0</b>Gider</div>
    <div class="stat"><b id="net">₺0</b>Net Kalan</div>
    <div class="stat"><b id="kasa">₺0</b>Kasa</div>
    <div class="stat"><b id="veresiye">₺0</b>Veresiye</div>
  </div>

  <div class="card">
    <h3 class="section-title" onclick="toggle('veresiyeListesi')">
      💳 Veresiye Defteri ▼
    </h3>
    <div id="veresiyeListesi" style="display:none"></div>
  </div>

  <div class="card">
    <h3 class="section-title" onclick="toggle('gecmisListesi')">
      📚 Geçmiş Kayıtlar ▼
    </h3>
    <div id="gecmisListesi" style="display:none"></div>
  </div>

  <div class="card">
    <h3 class="section-title" onclick="toggle('giderBolumu')">
      🧾 Günlük Giderler ▼
    </h3>

    <div id="giderBolumu" style="display:none">
      <input id="expenseDesc" placeholder="Gider açıklaması">
      <input id="expenseAmount" type="number" min="0" placeholder="Gider tutarı">
      <button type="button" onclick="addExpense()">+ Gider Ekle</button>
      <div id="expenseList"></div>
    </div>
  </div>

  <div class="card">
    <h3>Yeni Araç</h3>

    <input id="plate" placeholder="Plaka" autocapitalize="characters"
           list="plateSuggestions">
    <datalist id="plateSuggestions"></datalist>

    <label class="muted" for="plateCamera">Plakanın fotoğrafını çek</label>
    <input id="plateCamera" type="file" accept="image/*" capture="environment">

    <input id="customer" placeholder="Müşteri adı (isteğe bağlı)"
           list="customerSuggestions">
    <datalist id="customerSuggestions"></datalist>

    <div class="grid">
      <select id="service">
        <option>İç + Dış Yıkama</option>
        <option>İç Yıkama</option>
        <option>Dış Yıkama</option>
        <option>Detaylı Temizlik</option>
        <option>Pasta Cila</option>
        <option>Diğer</option>
      </select>

      <input id="price" type="number" min="0" placeholder="Ücret">
    </div>

    <div class="grid">
      <select id="payment">
        <option>Nakit</option>
        <option>Kart</option>
        <option>Veresiye</option>
      </select>

      <select id="status">
        <option>Bekliyor</option>
        <option>Yıkanıyor</option>
        <option>Hazır</option>
        <option>Teslim Edildi</option>
      </select>
    </div>

    <button type="button" onclick="addCar()">+ Araç Ekle</button>
  </div>

  <div class="card">
    <h3>Araçlar</h3>
    <div id="list"></div>
  </div>

<script>
const CAR_KEY="otoCars";
const HISTORY_KEY="gecmisKayitlar";
const WASH_KEY="plakaYikamaSayilari";
const EXPENSE_KEY="gunlukGiderler";
const CUSTOMER_KEY="musteriHafizasi";

function safeArray(key){
  try{
    const value=JSON.parse(localStorage.getItem(key));
    return Array.isArray(value)?value:[];
  }catch{
    return [];
  }
}

function safeObject(key){
  try{
    const value=JSON.parse(localStorage.getItem(key));
    return value&&typeof value==="object"&&!Array.isArray(value)?value:{};
  }catch{
    return {};
  }
}

let cars=safeArray(CAR_KEY);
let history=safeArray(HISTORY_KEY);
let washCounts=safeObject(WASH_KEY);
let expenses=safeArray(EXPENSE_KEY);
let customers=safeArray(CUSTOMER_KEY);

function save(){
  localStorage.setItem(CAR_KEY,JSON.stringify(cars));
  localStorage.setItem(HISTORY_KEY,JSON.stringify(history));
  localStorage.setItem(WASH_KEY,JSON.stringify(washCounts));
  localStorage.setItem(EXPENSE_KEY,JSON.stringify(expenses));
  localStorage.setItem(CUSTOMER_KEY,JSON.stringify(customers));
}

function money(number){
  return "₺"+Number(number||0).toLocaleString("tr-TR");
}

function esc(value){
  return String(value??"").replace(/[&<>"']/g,function(character){
    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[character];
  });
}

function dayText(date=new Date()){
  return date.toLocaleDateString("tr-TR");
}

function dateTimeText(value){
  const date=value?new Date(value):new Date();

  if(Number.isNaN(date.getTime())){
    return "Tarih yok";
  }

  return date.toLocaleString("tr-TR",{
    dateStyle:"short",
    timeStyle:"short"
  });
}

function normalizePlate(value){
  return String(value||"")
    .toLocaleUpperCase("tr-TR")
    .replace(/[^0-9A-ZÇĞİÖŞÜ]/g,"")
    .trim();
}

function normalizeName(value){
  return String(value||"").toLocaleLowerCase("tr-TR").trim();
}

function toggle(id){
  const element=document.getElementById(id);
  element.style.display=element.style.display==="none"?"block":"none";
}

function rememberCustomer(record){
  const plate=normalizePlate(record.plate);

  if(!plate){
    return;
  }

  const found=customers.find(function(customer){
    return normalizePlate(customer.plate)===plate;
  });

  const data={
    plate:plate,
    customer:String(record.customer||"").trim(),
    service:record.service||"İç + Dış Yıkama",
    price:Number(record.price||0),
    updatedAt:record.createdAt||new Date().toISOString()
  };

  if(found){
    Object.assign(found,data);
  }else{
    customers.unshift(data);
  }
}

function fillKnownCustomer(record,source){
  if(!record){
    return;
  }

  if(source!=="plate"){
    document.getElementById("plate").value=record.plate||"";
  }

  if(source!=="customer"){
    document.getElementById("customer").value=record.customer||"";
  }

  if(record.service){
    document.getElementById("service").value=record.service;
  }

  document.getElementById("price").value=record.price||"";
}

function findByPlate(){
  const value=normalizePlate(document.getElementById("plate").value);

  const record=customers.find(function(customer){
    return normalizePlate(customer.plate)===value;
  });

  fillKnownCustomer(record,"plate");
}

function findByCustomer(){
  const value=normalizeName(document.getElementById("customer").value);

  const record=customers.find(function(customer){
    return normalizeName(customer.customer)===value;
  });

  fillKnownCustomer(record,"customer");
}

function renderSuggestions(){
  document.getElementById("plateSuggestions").innerHTML=
    customers.map(function(customer){
      return `<option value="${esc(customer.plate)}">${esc(customer.customer||"")}</option>`;
    }).join("");

  document.getElementById("customerSuggestions").innerHTML=
    customers.filter(function(customer){
      return customer.customer;
    }).map(function(customer){
      return `<option value="${esc(customer.customer)}">${esc(customer.plate)}</option>`;
    }).join("");
}

function addCar(){
  const plate=normalizePlate(document.getElementById("plate").value);
  const customer=document.getElementById("customer").value.trim();
  const price=Number(document.getElementById("price").value);
  const service=document.getElementById("service").value;
  const payment=document.getElementById("payment").value;
  const status=document.getElementById("status").value;

  if(!plate){
    alert("Plaka yazmalısın.");
    return;
  }

  if(!Number.isFinite(price)||price<0){
    alert("Geçerli bir ücret yazmalısın.");
    return;
  }

  washCounts[plate]=(Number(washCounts[plate])||0)+1;

  const record={
    id:Date.now(),
    plate:plate,
    customer:customer,
    price:price,
    service:service,
    payment:payment,
    status:status,
    washNo:washCounts[plate],
    createdAt:new Date().toISOString(),
    dayClosed:false
  };

  cars.unshift(record);
  rememberCustomer(record);

  document.getElementById("plate").value="";
  document.getElementById("customer").value="";
  document.getElementById("price").value="";
  document.getElementById("plateCamera").value="";

  save();
  render();
}

function changeStatus(id,value){
  const car=cars.find(function(item){
    return item.id===id;
  });

  if(car){
    car.status=value;
    save();
    render();
  }
}

function delCar(id){
  if(!confirm("Bu araç kaydı silinsin mi?")){
    return;
  }

  cars=cars.filter(function(car){
    return car.id!==id;
  });

  save();
  render();
}

function collectCredit(plate){
  const open=cars.filter(function(car){
    return car.plate===plate&&car.payment==="Veresiye";
  });

  if(!open.length){
    return;
  }

  const total=open.reduce(function(sum,car){
    return sum+Number(car.price||0);
  },0);

  if(!confirm(plate+" için "+money(total)+" tahsil edildi mi?")){
    return;
  }

  open.forEach(function(car){
    car.payment="Nakit";
    car.collectedAt=new Date().toISOString();
  });

  save();
  render();
}

function addExpense(){
  const description=document.getElementById("expenseDesc").value.trim();
  const amount=Number(document.getElementById("expenseAmount").value);

  if(!description){
    alert("Gider açıklaması yazmalısın.");
    return;
  }

  if(!Number.isFinite(amount)||amount<=0){
    alert("Geçerli bir gider tutarı yazmalısın.");
    return;
  }

  expenses.unshift({
    id:Date.now(),
    description:description,
    amount:amount,
    createdAt:new Date().toISOString()
  });

  document.getElementById("expenseDesc").value="";
  document.getElementById("expenseAmount").value="";

  save();
  render();
}

function delExpense(id){
  if(!confirm("Bu gider kaydı silinsin mi?")){
    return;
  }

  expenses=expenses.filter(function(expense){
    return expense.id!==id;
  });

  save();
  render();
}

function closeDay(){
  const dailyCars=cars.filter(function(car){
    return !car.dayClosed;
  });

  if(!dailyCars.length&&!expenses.length){
    alert("Kapatılacak günlük işlem yok.");
    return;
  }

  if(!confirm("Günü kapatmak istediğine emin misin? Veresiye kayıtları silinmeyecek.")){
    return;
  }

  const archiveCars=dailyCars.filter(function(car){
    return car.payment!=="Veresiye";
  });

  history.unshift({
    date:dayText(),
    cars:archiveCars,
    expenses:[...expenses]
  });

  cars=cars
    .filter(function(car){
      return car.payment==="Veresiye";
    })
    .map(function(car){
      return {...car,dayClosed:true};
    });

  expenses=[];

  save();
  render();

  alert("Gün kapatıldı. Araç sayısı sıfırlandı ve veresiyeler korundu.");
}

function carRow(car){
  const options=["Bekliyor","Yıkanıyor","Hazır","Teslim Edildi"]
    .map(function(status){
      return `<option ${car.status===status?"selected":""}>${status}</option>`;
    }).join("");

  return `
    <div class="row">
      <div class="titleline">
        <b>${esc(car.plate)}</b>
        <span class="badge">${esc(car.washNo||1)}. yıkama</span>
      </div>

      <div>${esc(car.customer||"Müşteri adı yok")} · ${esc(car.service||"")}</div>
      <div><b>${money(car.price)}</b> · ${esc(car.payment||"Nakit")}</div>
      <div class="muted">📅 ${dateTimeText(car.createdAt)}</div>

      <div class="actions">
        <select onchange="changeStatus(${Number(car.id)},this.value)">
          ${options}
        </select>

        <button class="danger" onclick="delCar(${Number(car.id)})">Sil</button>
      </div>
    </div>
  `;
}

function renderCredit(){
  const groups={};

  cars.filter(function(car){
    return car.payment==="Veresiye";
  }).forEach(function(car){
    if(!groups[car.plate]){
      groups[car.plate]={
        customer:car.customer,
        items:[],
        total:0
      };
    }

    groups[car.plate].items.push(car);
    groups[car.plate].total+=Number(car.price||0);
  });

  const values=Object.entries(groups);

  document.getElementById("veresiyeListesi").innerHTML=
    values.length?values.map(function(entry){
      const plate=entry[0];
      const group=entry[1];

      return `
        <div class="row">
          <div class="credit-head">
            <div>
              <b>${esc(plate)}</b>
              <div class="muted">
                ${esc(group.customer||"Müşteri adı yok")} · ${group.items.length} yıkama
              </div>
            </div>

            <span class="credit-total">${money(group.total)}</span>
          </div>

          ${group.items.map(function(car,index){
            return `
              <div class="muted">
                ${index+1}. yıkama — ${esc(car.service||"")} —
                ${money(car.price)} — 📅 ${dateTimeText(car.createdAt)}
              </div>
            `;
          }).join("")}

          <button class="paid" onclick="collectCredit('${esc(plate)}')">
            Ödeme Alındı
          </button>
        </div>
      `;
    }).join(""):'<div class="empty">Açık veresiye kaydı yok.</div>';
}

function renderHistory(){
  document.getElementById("gecmisListesi").innerHTML=
    history.length?history.map(function(record){
      const gross=(record.cars||[]).reduce(function(sum,car){
        return sum+Number(car.price||0);
      },0);

      const spent=(record.expenses||[]).reduce(function(sum,expense){
        return sum+Number(expense.amount||0);
      },0);

      return `
        <div class="row">
          <b>${esc(record.date)}</b>
          <div class="muted">
            ${(record.cars||[]).length} araç ·
            Ciro ${money(gross)} ·
            Gider ${money(spent)} ·
            Net ${money(gross-spent)}
          </div>
        </div>
      `;
    }).join(""):'<div class="empty">Henüz geçmiş kayıt yok.</div>';
}

function renderExpenses(){
  document.getElementById("expenseList").innerHTML=
    expenses.length?expenses.map(function(expense){
      return `
        <div class="row">
          <div class="titleline">
            <div>
              <b>${esc(expense.description)}</b>
              <div class="muted">📅 ${dateTimeText(expense.createdAt)}</div>
            </div>

            <b>${money(expense.amount)}</b>
          </div>

          <button class="danger" onclick="delExpense(${Number(expense.id)})">
            Gideri Sil
          </button>
        </div>
      `;
    }).join(""):'<div class="empty">Bugün gider eklenmedi.</div>';
}

function render(){
  const todayCars=cars.filter(function(car){
    return !car.dayClosed;
  });

  const paid=todayCars.filter(function(car){
    return car.payment!=="Veresiye";
  }).reduce(function(sum,car){
    return sum+Number(car.price||0);
  },0);

  const cash=todayCars.filter(function(car){
    return car.payment==="Nakit"&&car.status==="Teslim Edildi";
  }).reduce(function(sum,car){
    return sum+Number(car.price||0);
  },0);

  const credit=cars.filter(function(car){
    return car.payment==="Veresiye";
  }).reduce(function(sum,car){
    return sum+Number(car.price||0);
  },0);

  const spent=expenses.reduce(function(sum,expense){
    return sum+Number(expense.amount||0);
  },0);

  document.getElementById("count").textContent=todayCars.length;
  document.getElementById("ciro").textContent=money(paid);
  document.getElementById("gider").textContent=money(spent);
  document.getElementById("net").textContent=money(paid-spent);
  document.getElementById("kasa").textContent=money(cash-spent);
  document.getElementById("veresiye").textContent=money(credit);

  document.getElementById("list").innerHTML=
    todayCars.length
      ?todayCars.map(carRow).join("")
      :'<div class="empty">Bugün henüz araç eklenmedi.</div>';

  renderCredit();
  renderHistory();
  renderExpenses();
  renderSuggestions();
}

document.getElementById("plate").addEventListener("input",findByPlate);
document.getElementById("customer").addEventListener("input",findByCustomer);

render();
</script>

</body>
</html>
